var NS='http://www.w3.org/2000/svg';
function el(name,attrs,parent){var e=document.createElementNS(NS,name);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

// ---------- bokeh
var bokeh=[], bg=$('bokehG');
var bkIds=['bkW','bkG','bkP','bkW','bkG'];
for(var i=0;i<18;i++){
  var r=50+rnd()*110;
  bokeh.push({x:rnd()*1080,y:80+rnd()*1500,r:r,ph:rnd()*6.28,sp:.15+rnd()*.25,ax:20+rnd()*30,ay:16+rnd()*26,
    e:el('circle',{r:r,fill:'url(#'+bkIds[i%5]+')'},bg)});
}
// ---------- stars
var STAR='M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1Z', stars=[], sg=$('starG');
var scols=['#FFFFFF','#FFF2B8','#FFD6EC','#FFFFFF','#FFE08A'];
for(var i=0;i<72;i++){
  stars.push({x:30+rnd()*1020,y:40+rnd()*1840,sz:9+rnd()*24,ph:rnd()*6.28,sp:1.6+rnd()*2.6,
    e:el('path',{d:STAR,fill:scols[i%5]},sg)});
}
var burst=[], bgG=$('burstG');
for(var i=0;i<18;i++){
  var a=i/18*6.2832+rnd()*.3;
  burst.push({a:a,d:260+rnd()*220,sz:16+rnd()*18,e:el('path',{d:STAR,fill:i%2?'#FFF2B8':'#FFFFFF'},bgG)});
}
// ---------- glitter on envelope
function inTri(p,a,b,c){
  function sg(p1,p2,p3){return (p1[0]-p3[0])*(p2[1]-p3[1])-(p2[0]-p3[0])*(p1[1]-p3[1]);}
  var d1=sg(p,a,b),d2=sg(p,b,c),d3=sg(p,c,a);
  var neg=(d1<0)||(d2<0)||(d3<0),pos=(d1>0)||(d2>0)||(d3>0);return !(neg&&pos);
}
var tris=[[[90,900],[540,1246],[90,1520]],[[990,900],[540,1246],[990,1520]],[[90,1520],[540,1246],[990,1520]]];
var gf=$('glitFront'), n=0;
while(n<150){
  var p=[90+rnd()*900,900+rnd()*620], ok=false;
  for(var k=0;k<3;k++) if(inTri(p,tris[k][0],tris[k][1],tris[k][2])) ok=true;
  if(!ok) continue; n++;
  el('circle',{cx:p[0],cy:p[1],r:1.1+rnd()*2.4,fill:rnd()<.35?'#FFF1B5':'#FFFFFF',opacity:.45+rnd()*.5},gf);
}
for(var i=0;i<9;i++){
  var p=[90+rnd()*900,900+rnd()*620], ok=false;
  for(var k=0;k<3;k++) if(inTri(p,tris[k][0],tris[k][1],tris[k][2])) ok=true;
  if(!ok){i--;continue;}
  el('path',{d:STAR,fill:'#FFFFFF',opacity:.85,transform:'translate('+p[0]+' '+p[1]+') scale('+(8+rnd()*8)+')'},gf);
}
var gfl=$('glitFlap'); n=0;
while(n<55){
  var p=[rnd()*900,rnd()*346];
  if(!inTri(p,[0,0],[900,0],[450,346])) continue; n++;
  el('circle',{cx:p[0],cy:p[1],r:1.1+rnd()*2.4,fill:rnd()<.35?'#FFF1B5':'#FFFFFF',opacity:.45+rnd()*.5},gfl);
}
// ---------- orbit particles
var orbit=[], og=$('orbitG');
for(var i=0;i<34;i++){
  var o={ph:i/34*6.2832+rnd()*.2,sp:.35+rnd()*.55,rx:380+rnd()*170,ry:560+rnd()*200,sz:3+rnd()*5,es:[]};
  for(var k=0;k<4;k++) o.es.push(el('circle',{fill:k==0?'#FFFBE0':'#FFE08A'},og));
  orbit.push(o);
}
// ---------- swirl ribbons
var swirl=[], sw=$('swirlG');
function swirlPath(){
  var d='';
  for(var th=0;th<=12.57;th+=.05){
    var x=(420+110*Math.cos(.5*th+1))*Math.cos(th), y=(660+70*Math.sin(.5*th))*Math.sin(th);
    d+=(th==0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }
  return d;
}
var pd=swirlPath();
for(var i=0;i<2;i++){
  var g=el('g',{},sw);
  var glow=el('path',{d:pd,fill:'none',stroke:'#FFD36B','stroke-width':22,'stroke-linecap':'round',opacity:.0},g);
  var core=el('path',{d:pd,fill:'none',stroke:'url(#gSw)','stroke-width':5,'stroke-linecap':'round'},g);
  swirl.push({g:g,glow:glow,core:core,L:core.getTotalLength(),flip:i?-1:1,off:i?1.7:0});
}
// ---------- butterflies
var bflies=[], bf=$('bflyG');
var bcols=[['#F7A8D8','#FFD3EC'],['#C9A8F5','#E6D6FF'],['#FFB6C9','#FFE0E8']];
for(var i=0;i<3;i++){
  var g=el('g',{},bf), L=el('g',{},g), R=el('g',{},g);
  [L,R].forEach(function(w){
    el('path',{d:'M0,0 C-10,-34 -48,-40 -44,-8 C-42,12 -14,8 0,0Z',fill:bcols[i][0]},w);
    el('path',{d:'M0,0 C-8,12 -34,34 -24,42 C-14,48 -4,20 0,0Z',fill:bcols[i][1]},w);
    el('circle',{cx:-30,cy:-16,r:5,fill:'#fff',opacity:.7},w);
  });
  el('ellipse',{cx:0,cy:2,rx:3.6,ry:16,fill:'#8A3A6E'},g);
  bflies.push({g:g,L:L,R:R,ph:i*2.1+.5,sc:1+i*.12,side:(i%2?1:-1)});
}

// ---------- element refs
var envBack=$('envBack'), envFront=$('envFront'), cardLayer=$('cardLayer'), card=$('card'), glow=$('glow');
var flapFront=$('flapFront'), flapBack=$('flapBack'), seal=$('seal'), t1=$('t1'), t2=$('t2'), crown=$('crown');

function render(t){
  // background bokeh
  bokeh.forEach(function(b){
    b.e.setAttribute('cx',b.x+b.ax*Math.sin(t*b.sp+b.ph)); b.e.setAttribute('cy',b.y+b.ay*Math.cos(t*b.sp*1.3+b.ph));
  });
  // envelope motion
  var tIn=easeOut(seg(t,0,1.1));
  var bob=8*Math.sin(t*2.1)*(1-seg(t,2.0,2.6));
  var dy=(1-tIn)*90+bob+760*easeIO(seg(t,5.6,7.0));
  var eo=tIn*(1-seg(t,6.1,7.0));
  envBack.style.transform=envFront.style.transform='translateY('+dy+'px)';
  envBack.style.opacity=envFront.style.opacity=eo;
  // seal
  var pul=1+.07*Math.sin(t*5)*seg(t,1.2,2.2)*(1-seg(t,2.2,2.3));
  var pop=easeOut(seg(t,2.2,2.8));
  seal.setAttribute('transform','translate(540 1246) scale('+(pul+.7*pop)+')');
  seal.setAttribute('opacity',1-pop);
  // flap
  var sy=lerp(1,-1,easeIO(seg(t,2.5,3.5)));
  var tf='translate(90 900) scale(1 '+sy+')';
  if(sy>0.001){flapFront.style.display='';flapFront.setAttribute('transform',tf);flapBack.style.display='none';}
  else if(sy<-0.001){flapBack.style.display='';flapBack.setAttribute('transform',tf);flapFront.style.display='none';}
  else{flapFront.style.display='none';flapBack.style.display='none';}
  // card
  var r1=easeOut(seg(t,3.6,5.6)), r2=easeIO(seg(t,5.6,7.0)), r3=easeIO(seg(t,10.2,11.4));
  var s=.70+.10*r1+.15*r2-.11*r3;
  var top=1010-680*r1-40*r2+250*r3;
  var fl=Math.max(0,t-7.0);
  var bobY=10*Math.sin(1.6*fl)*seg(t,7,7.8);
  var rot=1.6*Math.sin(1.1*fl)*seg(t,7,8)*(1-.7*r3);
  var cy=top+720*s+bobY;
  card.style.transform='translate(540px,'+cy+'px) rotate('+rot+'deg) scale('+s+') translate(-480px,-720px)';
  cardLayer.style.opacity=t<2.9?0:1;
  cardLayer.style.clipPath='inset(-4000px -500px '+(400-dy)+'px -500px)';
  // glow
  var gy=lerp(1000,cy,seg(t,3.6,6.0));
  glow.style.top=(gy-800)+'px';
  glow.style.opacity=.85*seg(t,3.2,4.6)*(1-.25*seg(t,10.2,11.4));
  // texts
  t1.style.opacity=seg(t,.3,1.3)*(1-seg(t,4.0,4.8));
  t1.style.transform='translateY('+(18*(1-easeOut(seg(t,.3,1.3))))+'px)';
  var a2=seg(t,10.6,11.6);
  t2.style.opacity=a2; crown.style.opacity=a2;
  t2.style.transform=crown.style.transform='translateY('+(20*(1-easeOut(a2)))+'px)';
  // stars
  var ga=seg(t,.2,1.2);
  stars.forEach(function(st){
    var tw=.5+.5*Math.sin(t*st.sp+st.ph);
    var sc=st.sz*(.55+.45*tw);
    st.e.setAttribute('transform','translate('+st.x+' '+st.y+') scale('+sc+')');
    st.e.setAttribute('opacity',ga*(.18+.82*tw));
  });
  // burst from the seal
  var bu=seg(t,2.2,3.4), be=easeOut(bu);
  burst.forEach(function(b){
    var x=540+Math.cos(b.a)*b.d*be, y=1246+dy+Math.sin(b.a)*b.d*be;
    b.e.setAttribute('transform','translate('+x+' '+y+') scale('+(b.sz*(1-bu))+')');
    b.e.setAttribute('opacity',bu>0&&bu<1?1-bu*bu:0);
  });
  // orbit sparkles
  var oa=seg(t,4.8,5.8)*(1-.6*seg(t,10.6,11.6));
  orbit.forEach(function(o){
    for(var k=0;k<4;k++){
      var a=o.ph+t*o.sp-k*.07*o.sp*3;
      var e=o.es[k];
      e.setAttribute('cx',540+o.rx*Math.cos(a)); e.setAttribute('cy',cy+o.ry*Math.sin(a));
      e.setAttribute('r',o.sz*(1-.2*k)); e.setAttribute('opacity',oa*(1-.27*k)*(.55+.45*Math.sin(t*3+o.ph*3)));
    }
  });
  // swirl ribbons
  var sa=seg(t,4.8,5.6)*(1-seg(t,9.8,10.6));
  swirl.forEach(function(w){
    w.g.setAttribute('transform','translate(540 '+cy+') scale('+w.flip+' 1)');
    var len=320, pos=((t-4.8+w.off)*360)%(w.L+len);
    var da=len+' '+(w.L+len);
    w.core.setAttribute('stroke-dasharray',da); w.glow.setAttribute('stroke-dasharray',da);
    w.core.setAttribute('stroke-dashoffset',-(pos-len)); w.glow.setAttribute('stroke-dashoffset',-(pos-len));
    w.core.setAttribute('opacity',.95*sa); w.glow.setAttribute('opacity',.22*sa);
  });
  // butterflies
  var ba=seg(t,5.0,5.8)*(1-.5*seg(t,10.8,11.6));
  bflies.forEach(function(b){
    var x=540+b.side*(478+34*Math.sin(.9*t+b.ph)), y=cy-40+540*Math.cos(.33*t+b.ph*1.3)*(b.ph>2?.8:1);
    var wx=.28+.72*Math.abs(Math.cos(t*9+b.ph));
    b.L.setAttribute('transform','scale('+wx+' 1)'); b.R.setAttribute('transform','scale('+(-wx)+' 1)');
    b.g.setAttribute('transform','translate('+x+' '+y+') rotate('+(14*Math.sin(t*.9+b.ph))+') scale('+b.sc+')');
    b.g.setAttribute('opacity',ba);
  });
}
render(0);

(function(){
  var fit=document.getElementById('fit');
  function resize(){
    var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/1080,h/1920);
    fit.style.transform='scale('+s+')';
    fit.style.left=((w-1080*s)/2)+'px'; fit.style.top=((h-1920*s)/2)+'px';
  }
  resize(); window.addEventListener('resize',resize);

  var openBtn=document.getElementById('openBtn'), replayBtn=document.getElementById('replayBtn');
  var mode='intro', te=0, dir=1, last=null, started=false, openA=0, replayA=0;

  function setBtn(b,o){ b.style.opacity=o; b.style.pointerEvents=o>.6?'auto':'none'; }

  openBtn.addEventListener('click',function(){ if(mode==='wait'||mode==='intro'){ mode='play'; } });
  replayBtn.addEventListener('click',function(){ te=0; dir=1; mode='intro'; });

  function frame(ts){
    if(last===null) last=ts;
    var dt=Math.min(.05,(ts-last)/1000); last=ts;
    if(mode==='intro'){ te+=dt; if(te>=1.5){ mode='wait'; dir=1; } }
    else if(mode==='wait'){ te+=dir*dt; if(te>1.95){te=1.95;dir=-1;} if(te<1.3){te=1.3;dir=1;} }
    else { te+=dt; }
    render(te);
    var k=Math.min(1,dt*6);
    openA+=(((mode==='wait')?1:0)-openA)*k;
    replayA+=(((mode==='play'&&te>12.5)?1:0)-replayA)*k;
    setBtn(openBtn,openA); setBtn(replayBtn,replayA);
    requestAnimationFrame(frame);
  }
  function go(){ if(started) return; started=true; requestAnimationFrame(frame); }
  var ready=[document.fonts?document.fonts.ready:Promise.resolve(), document.getElementById('card').decode?document.getElementById('card').decode().catch(function(){}):Promise.resolve()];
  Promise.all(ready).then(go); setTimeout(go,2500);
})();
</script>
</body>
</html>
